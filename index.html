<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Case Timeline</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --muted: #8a8f99;
    --accent: #3b5bdb;
    --pending: #f0a94a;
    --pending-bg: #fef3e2;
    --pending-border: #f0c27b;
    --completed: #2f9e5c;
    --completed-bg: #e7f7ee;
    --completed-border: #a3ddbb;
    --today-bg: #eef1fd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .page-inner {
    max-width: 1020px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  button.nav-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  button.nav-btn:hover { background: #f0f1f4; }
  button.today-btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.today-btn:hover { background: #f0f1f4; }

  #timeline-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
  }
  #timeline {
    position: relative;
    max-width: 1020px;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    overflow-anchor: none;
    padding: 16px 24px;
    gap: 20px;
  }
  #timeline::-webkit-scrollbar { height: 10px; }
  #timeline::-webkit-scrollbar-thumb { background: #d3d6dd; border-radius: 6px; }
  #timeline::-webkit-scrollbar-track { background: transparent; }
  #timeline.panning {
    cursor: grabbing;
    user-select: none;
  }
  #timeline.panning .week-col { cursor: grabbing; }

  .week-col {
    cursor: grab;
    flex: 0 0 300px;
    width: 300px;
    height: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .week-col.is-today {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .week-col.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
    background: var(--today-bg);
  }
  .week-col-header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .week-col.is-today .week-col-header {
    background: var(--today-bg);
  }
  .week-date {
    font-size: 15px;
    font-weight: 700;
  }
  .week-today-tag {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .week-cases {
    flex: 1;
    overflow-y: auto;
    padding: 7px 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-height: 0;
  }
  .case-card {
    position: relative;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: grab;
    border: 1px solid var(--pending-border);
    background: var(--pending-bg);
    transition: transform 0.06s ease, opacity 0.1s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .case-card:active { transform: scale(0.98); }
  .case-card.completed {
    border-color: var(--completed-border);
    background: var(--completed-bg);
  }
  .case-card.dragging {
    opacity: 0.4;
    cursor: grabbing;
  }
  .case-content {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .case-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .case-right {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-height: 24px;
  }
  .case-fee {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    transition: opacity 0.08s ease;
  }
  .case-card.completed .case-fee { color: #4c8a67; }
  .case-actions {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    display: flex;
    gap: 4px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.08s ease;
  }
  .case-card:hover .case-fee,
  .case-card:focus-within .case-fee { opacity: 0; }
  .case-card:hover .case-actions,
  .case-card:focus-within .case-actions { opacity: 1; pointer-events: auto; }
  .case-icon-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .case-icon-btn:hover { background: rgba(0,0,0,0.08); }
  .case-icon-btn.edit:hover { color: var(--accent); }
  .case-icon-btn.delete:hover { color: #c0392b; }
  .case-status-dot {
    position: absolute;
    top: 4px;
    left: -1px;
    width: 3px;
    height: calc(100% - 8px);
    border-radius: 3px;
    background: var(--pending);
  }
  .case-card.completed .case-status-dot { background: var(--completed); }

  .case-card.editing {
    cursor: default;
    align-items: stretch;
  }
  .case-card.editing .case-content,
  .case-card.editing .case-status-dot { display: none; }
  .case-edit-form {
    display: none;
    flex-direction: column;
    gap: 5px;
    flex: 1;
  }
  .case-card.editing .case-edit-form { display: flex; }
  .case-edit-form input {
    font-size: 12.5px;
    padding: 5px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
    outline: none;
    width: 100%;
  }
  .case-edit-form input:focus { border-color: var(--accent); }
  .case-edit-row {
    display: flex;
    gap: 5px;
  }
  .case-edit-row input { flex: 1; min-width: 0; }

  .empty-hint {
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    padding: 10px 4px;
  }

  .week-footer {
    border-top: 1px solid var(--border);
    padding: 6px 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    background: #fafbfc;
    flex-shrink: 0;
  }
  .week-footer .fee-completed { color: var(--completed); }
  .week-footer .fee-sep { color: var(--muted); font-weight: 500; margin: 0 3px; }
  .week-footer .fee-total { color: var(--text); }

  .add-case-area {
    border-top: 1px solid var(--border);
    padding: 6px 8px;
    flex-shrink: 0;
  }
  .add-case-btn {
    width: 100%;
    padding: 5px;
    border-radius: 8px;
    border: 1px dashed #c7cad2;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-case-btn:hover { background: #f5f6f8; color: var(--text); }

  .add-case-form {
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .add-case-form.open { display: flex; }
  .add-case-form input {
    font-size: 12.5px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    outline: none;
    width: 100%;
  }
  .add-case-form input:focus { border-color: var(--accent); }
  .form-btn-row {
    display: flex;
    gap: 6px;
  }
  .form-btn-row button {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--panel);
  }
  .form-btn-row button.save {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .form-btn-row button.cancel:hover { background: #f0f1f4; }

  .legend {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }
  .legend-swatch.pending { background: var(--pending); }
  .legend-swatch.completed { background: var(--completed); }

  @media (max-width: 640px) {
    header h1 { font-size: 15px; }
    .legend { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="page-inner">
    <h1>Weekly Case Timeline</h1>
    <div class="legend">
      <div class="legend-item"><span class="legend-swatch pending"></span>Pending</div>
      <div class="legend-item"><span class="legend-swatch completed"></span>Completed</div>
    </div>
    <div class="header-controls">
      <button class="nav-btn" id="prevBtn" title="Previous week" aria-label="Previous week">&#8249;</button>
      <button class="today-btn" id="todayBtn">This Week</button>
      <button class="nav-btn" id="nextBtn" title="Next week" aria-label="Next week">&#8250;</button>
    </div>
  </div>
</header>

<div id="timeline-wrap">
  <div id="timeline"></div>
</div>

<script>
(function () {
  "use strict";

  // Stop the browser from trying to restore its own idea of scroll position
  // on reload/back-forward navigation -- we compute and own the initial
  // "center on this week" position ourselves below.
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  var STORAGE_KEY = "wct-cases-v1";
  var ANCHOR_DOW = 5; // Friday - matches the firm's weekly closing day
  var COL_WIDTH = 300;
  var COL_GAP = 20;
  var STEP = COL_WIDTH + COL_GAP;
  var INITIAL_BACK = 10;
  var INITIAL_FWD = 14;
  var LOAD_MORE = 8;

  var timeline = document.getElementById("timeline");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var todayBtn = document.getElementById("todayBtn");

  var data = loadData();
  var weeks = []; // array of Date objects (week anchor dates), ascending
  var todayWeekKey = null;
  var dragged = { weekKey: null, id: null };

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function dateKey(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function formatLabel(d) {
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  function addDays(d, n) {
    var r = new Date(d);
    r.setDate(r.getDate() + n);
    return r;
  }

  function anchorOnOrBefore(d) {
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = (r.getDay() - ANCHOR_DOW + 7) % 7;
    r.setDate(r.getDate() - diff);
    return r;
  }

  function currency(n) {
    var num = Number(n);
    if (isNaN(num)) num = 0;
    return "$" + num.toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function formatK(n) {
    var num = Number(n) || 0;
    var sign = num < 0 ? "-" : "";
    var abs = Math.abs(num);
    if (abs >= 1000) {
      var val = abs / 1000;
      var str = val.toFixed(1);
      if (str.slice(-2) === ".0") str = str.slice(0, -2);
      return sign + "$" + str + "k";
    }
    return sign + "$" + Math.round(abs).toLocaleString();
  }

  function uid() {
    return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function initWeeks() {
    var today = new Date();
    var anchor = anchorOnOrBefore(today);
    todayWeekKey = dateKey(anchor);
    weeks = [];
    for (var i = -INITIAL_BACK; i <= INITIAL_FWD; i++) {
      weeks.push(addDays(anchor, i * 7));
    }
  }

  function buildCaseCard(weekKey, caseObj) {
    var card = document.createElement("div");
    card.className = "case-card" + (caseObj.status === "completed" ? " completed" : "");
    card.tabIndex = 0;
    card.title = "Click to toggle status · hover for edit/delete · drag to move to another week";
    card.draggable = true;

    var dot = document.createElement("div");
    dot.className = "case-status-dot";

    var content = document.createElement("div");
    content.className = "case-content";

    var name = document.createElement("div");
    name.className = "case-name";
    name.textContent = caseObj.name;

    var right = document.createElement("div");
    right.className = "case-right";

    var fee = document.createElement("div");
    fee.className = "case-fee";
    fee.textContent = currency(caseObj.fee);

    var actions = document.createElement("div");
    actions.className = "case-actions";

    var editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "case-icon-btn edit";
    editBtn.innerHTML = "&#9998;";
    editBtn.title = "Edit case";

    var delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "case-icon-btn delete";
    delBtn.innerHTML = "&times;";
    delBtn.title = "Delete case";

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    right.appendChild(fee);
    right.appendChild(actions);
    content.appendChild(name);
    content.appendChild(right);

    var editForm = document.createElement("div");
    editForm.className = "case-edit-form";

    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = caseObj.name;

    var editRow = document.createElement("div");
    editRow.className = "case-edit-row";

    var feeInput = document.createElement("input");
    feeInput.type = "number";
    feeInput.min = "0";
    feeInput.step = "any";
    feeInput.value = caseObj.fee;

    var editBtnRow = document.createElement("div");
    editBtnRow.className = "form-btn-row";
    var saveEditBtn = document.createElement("button");
    saveEditBtn.type = "button";
    saveEditBtn.className = "save";
    saveEditBtn.textContent = "Save";
    var cancelEditBtn = document.createElement("button");
    cancelEditBtn.type = "button";
    cancelEditBtn.className = "cancel";
    cancelEditBtn.textContent = "Cancel";
    editBtnRow.appendChild(saveEditBtn);
    editBtnRow.appendChild(cancelEditBtn);

    editRow.appendChild(feeInput);
    editRow.appendChild(editBtnRow);
    editForm.appendChild(nameInput);
    editForm.appendChild(editRow);

    card.appendChild(dot);
    card.appendChild(content);
    card.appendChild(editForm);

    var editing = false;

    function enterEdit(e) {
      e.stopPropagation();
      editing = true;
      card.draggable = false;
      card.classList.add("editing");
      nameInput.value = caseObj.name;
      feeInput.value = caseObj.fee;
      nameInput.focus();
      nameInput.select();
    }
    function exitEdit() {
      editing = false;
      card.draggable = true;
      card.classList.remove("editing");
    }
    function submitEdit() {
      var name = nameInput.value.trim();
      var fee = parseFloat(feeInput.value);
      if (!name) { nameInput.focus(); return; }
      if (isNaN(fee)) fee = 0;
      editCase(weekKey, caseObj.id, name, fee);
    }

    editBtn.addEventListener("click", enterEdit);
    delBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (confirm('Delete "' + caseObj.name + '"?')) {
        removeCase(weekKey, caseObj.id);
      }
    });
    saveEditBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      submitEdit();
    });
    cancelEditBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      exitEdit();
    });
    nameInput.addEventListener("click", function (e) { e.stopPropagation(); });
    feeInput.addEventListener("click", function (e) { e.stopPropagation(); });
    nameInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); feeInput.focus(); feeInput.select(); }
      if (e.key === "Escape") exitEdit();
    });
    feeInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submitEdit(); }
      if (e.key === "Escape") exitEdit();
    });

    card.addEventListener("click", function () {
      if (editing) return;
      toggleStatus(weekKey, caseObj.id);
    });

    card.addEventListener("dragstart", function (e) {
      dragged.weekKey = weekKey;
      dragged.id = caseObj.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", caseObj.id);
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", function () {
      card.classList.remove("dragging");
      dragged.weekKey = null;
      dragged.id = null;
      timeline.querySelectorAll(".week-col.drag-over").forEach(function (c) {
        c.classList.remove("drag-over");
      });
    });

    return card;
  }

  function toggleStatus(weekKey, id) {
    var list = data[weekKey];
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].status = list[i].status === "completed" ? "pending" : "completed";
        break;
      }
    }
    saveData();
    renderWeekColumn(weekKey);
  }

  function removeCase(weekKey, id) {
    var list = data[weekKey];
    if (!list) return;
    data[weekKey] = list.filter(function (c) { return c.id !== id; });
    saveData();
    renderWeekColumn(weekKey);
  }

  function addCase(weekKey, name, fee) {
    if (!data[weekKey]) data[weekKey] = [];
    data[weekKey].push({ id: uid(), name: name, fee: fee, status: "pending" });
    saveData();
    renderWeekColumn(weekKey);
  }

  function editCase(weekKey, id, name, fee) {
    var list = data[weekKey];
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].name = name;
        list[i].fee = fee;
        break;
      }
    }
    saveData();
    renderWeekColumn(weekKey);
  }

  function moveCase(fromWeekKey, toWeekKey, id) {
    var fromList = data[fromWeekKey];
    if (!fromList) return;
    var idx = -1;
    for (var i = 0; i < fromList.length; i++) {
      if (fromList[i].id === id) { idx = i; break; }
    }
    if (idx === -1) return;
    var item = fromList.splice(idx, 1)[0];
    if (!data[toWeekKey]) data[toWeekKey] = [];
    data[toWeekKey].push(item);
    saveData();
    renderWeekColumn(fromWeekKey);
    renderWeekColumn(toWeekKey);
  }

  function renderWeekColumn(weekKey) {
    var col = timeline.querySelector('.week-col[data-key="' + weekKey + '"]');
    if (!col) return;

    var casesWrap = col.querySelector(".week-cases");
    var footer = col.querySelector(".week-footer");
    var list = data[weekKey] || [];

    casesWrap.innerHTML = "";
    if (list.length === 0) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "No cases yet";
      casesWrap.appendChild(hint);
    } else {
      list.forEach(function (c) {
        casesWrap.appendChild(buildCaseCard(weekKey, c));
      });
    }

    var total = list.reduce(function (s, c) { return s + (Number(c.fee) || 0); }, 0);
    var completedTotal = list
      .filter(function (c) { return c.status === "completed"; })
      .reduce(function (s, c) { return s + (Number(c.fee) || 0); }, 0);

    footer.innerHTML =
      '<span class="fee-completed">' + formatK(completedTotal) + "</span>" +
      '<span class="fee-sep">/</span>' +
      '<span class="fee-total">' + formatK(total) + "</span>";
  }

  function buildWeekColumn(weekDate) {
    var weekKey = dateKey(weekDate);
    var col = document.createElement("div");
    col.className = "week-col" + (weekKey === todayWeekKey ? " is-today" : "");
    col.setAttribute("data-key", weekKey);

    var header = document.createElement("div");
    header.className = "week-col-header";
    var dateEl = document.createElement("div");
    dateEl.className = "week-date";
    dateEl.textContent = formatLabel(weekDate);
    if (weekKey === todayWeekKey) {
      var tag = document.createElement("span");
      tag.className = "week-today-tag";
      tag.textContent = "This week";
      dateEl.appendChild(tag);
    }
    header.appendChild(dateEl);
    col.appendChild(header);

    var casesWrap = document.createElement("div");
    casesWrap.className = "week-cases";
    col.appendChild(casesWrap);

    var footer = document.createElement("div");
    footer.className = "week-footer";
    col.appendChild(footer);

    var addArea = document.createElement("div");
    addArea.className = "add-case-area";

    var addBtn = document.createElement("button");
    addBtn.className = "add-case-btn";
    addBtn.type = "button";
    addBtn.textContent = "+ Add case";

    var form = document.createElement("div");
    form.className = "add-case-form";
    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Case name (e.g. 01111-Smith)";
    var feeInput = document.createElement("input");
    feeInput.type = "number";
    feeInput.placeholder = "Fee amount";
    feeInput.min = "0";
    feeInput.step = "any";

    var btnRow = document.createElement("div");
    btnRow.className = "form-btn-row";
    var saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.type = "button";
    saveBtn.textContent = "Add";
    var cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.type = "button";
    cancelBtn.textContent = "Cancel";
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);

    form.appendChild(nameInput);
    form.appendChild(feeInput);
    form.appendChild(btnRow);

    function closeForm() {
      form.classList.remove("open");
      addBtn.style.display = "";
      nameInput.value = "";
      feeInput.value = "";
    }
    function openForm() {
      addBtn.style.display = "none";
      form.classList.add("open");
      nameInput.focus();
    }
    function submitForm() {
      var name = nameInput.value.trim();
      var fee = parseFloat(feeInput.value);
      if (!name) { nameInput.focus(); return; }
      if (isNaN(fee)) fee = 0;
      addCase(weekKey, name, fee);
      closeForm();
    }

    addBtn.addEventListener("click", openForm);
    cancelBtn.addEventListener("click", closeForm);
    saveBtn.addEventListener("click", submitForm);
    nameInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); feeInput.focus(); }
      if (e.key === "Escape") closeForm();
    });
    feeInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submitForm(); }
      if (e.key === "Escape") closeForm();
    });

    addArea.appendChild(addBtn);
    addArea.appendChild(form);
    col.appendChild(addArea);

    var dragLeaveTimer = null;
    col.addEventListener("dragenter", function (e) {
      if (!dragged.id) return;
      e.preventDefault();
      if (dragLeaveTimer) { clearTimeout(dragLeaveTimer); dragLeaveTimer = null; }
      col.classList.add("drag-over");
    });
    col.addEventListener("dragover", function (e) {
      if (!dragged.id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
    });
    col.addEventListener("dragleave", function () {
      dragLeaveTimer = setTimeout(function () {
        col.classList.remove("drag-over");
      }, 40);
    });
    col.addEventListener("drop", function (e) {
      e.preventDefault();
      col.classList.remove("drag-over");
      if (!dragged.id || dragged.weekKey === weekKey) return;
      var fromWeekKey = dragged.weekKey;
      var id = dragged.id;
      dragged.weekKey = null;
      dragged.id = null;
      moveCase(fromWeekKey, weekKey, id);
    });

    return col;
  }

  function renderAll() {
    timeline.innerHTML = "";
    weeks.forEach(function (w) {
      timeline.appendChild(buildWeekColumn(w));
    });
    weeks.forEach(function (w) { renderWeekColumn(dateKey(w)); });
  }

  function prependWeeks(count) {
    var first = weeks[0];
    var newWeeks = [];
    for (var i = count; i >= 1; i--) {
      newWeeks.push(addDays(first, -i * 7));
    }
    var prevScrollWidth = timeline.scrollWidth;
    weeks = newWeeks.concat(weeks);
    var frag = document.createDocumentFragment();
    newWeeks.forEach(function (w) { frag.appendChild(buildWeekColumn(w)); });
    timeline.insertBefore(frag, timeline.firstChild);
    newWeeks.forEach(function (w) { renderWeekColumn(dateKey(w)); });
    var added = timeline.scrollWidth - prevScrollWidth;
    timeline.scrollLeft += added;
    // Keep an in-progress pan-drag consistent with the newly inserted columns.
    if (pan.active) pan.startScrollLeft += added;
  }

  function appendWeeks(count) {
    var last = weeks[weeks.length - 1];
    var newWeeks = [];
    for (var i = 1; i <= count; i++) {
      newWeeks.push(addDays(last, i * 7));
    }
    weeks = weeks.concat(newWeeks);
    var frag = document.createDocumentFragment();
    newWeeks.forEach(function (w) { frag.appendChild(buildWeekColumn(w)); });
    timeline.appendChild(frag);
    newWeeks.forEach(function (w) { renderWeekColumn(dateKey(w)); });
  }

  var initialScrollDone = false;

  // Defends the initial "centered on this week" position against being
  // silently nudged out of place by anything else on the page during load
  // (a focus jump, a late layout shift, a future feature that touches
  // scrollLeft, etc.) without us having to chase down each cause one at a
  // time. For a short window after load, any scroll that happens before the
  // user has deliberately interacted gets treated as unwanted drift and
  // corrected back; a real user action (arrow/This Week click, starting a
  // pan-drag, wheel, or touch) immediately calls off the correction so we
  // never fight genuine navigation.
  var settling = true;
  var userInteracted = false;
  var correctingScroll = false;

  function markUserInteracted() {
    userInteracted = true;
    settling = false;
  }

  function checkEdges() {
    if (!initialScrollDone) return;
    var threshold = STEP * 3;
    if (timeline.scrollLeft < threshold) {
      prependWeeks(LOAD_MORE);
    } else if (timeline.scrollWidth - timeline.scrollLeft - timeline.clientWidth < threshold) {
      appendWeeks(LOAD_MORE);
    }
  }

  function scrollToTodayColumn(smooth) {
    var col = timeline.querySelector('.week-col[data-key="' + todayWeekKey + '"]');
    if (!col) return;
    var target = Math.max(0, col.offsetLeft - (timeline.clientWidth - col.clientWidth) / 2);
    if (smooth) {
      timeline.scrollTo({ left: target, behavior: "smooth" });
    } else {
      // Direct assignment jumps instantly (no CSS scroll-behavior is set, so
      // there's nothing for scrollTo's "auto" to defer into on initial load).
      timeline.scrollLeft = target;
    }
  }

  prevBtn.addEventListener("click", function () {
    markUserInteracted();
    timeline.scrollBy({ left: -STEP, behavior: "smooth" });
  });
  nextBtn.addEventListener("click", function () {
    markUserInteracted();
    timeline.scrollBy({ left: STEP, behavior: "smooth" });
  });
  todayBtn.addEventListener("click", function () {
    markUserInteracted();
    scrollToTodayColumn(true);
  });

  function snapToNearestWeek(smooth) {
    var cols = timeline.querySelectorAll(".week-col");
    if (!cols.length) return;
    var anchorCol = cols[0];
    var anchorTarget = anchorCol.offsetLeft - (timeline.clientWidth - anchorCol.clientWidth) / 2;
    var maxScroll = Math.max(0, timeline.scrollWidth - timeline.clientWidth);
    var idx = Math.round((timeline.scrollLeft - anchorTarget) / STEP);
    var target = Math.min(Math.max(anchorTarget + idx * STEP, 0), maxScroll);
    timeline.scrollTo({ left: target, behavior: smooth ? "smooth" : "auto" });
  }

  // Click-and-drag panning: lets a mouse user swipe the timeline by dragging
  // empty space in a week box, without hijacking clicks on cases, buttons, or
  // form fields, and without interfering with the case cards' own HTML5
  // drag-and-drop (which is what actually moves a case between weeks).
  var pan = { active: false, moved: false, startX: 0, startScrollLeft: 0 };

  function isPanBlockedTarget(el) {
    if (el && el.nodeType !== 1) el = el.parentElement;
    if (!el) return true;
    return !!el.closest(".case-card, button, input, a, .case-edit-form");
  }

  timeline.addEventListener("mousedown", function (e) {
    if (e.button !== 0 || isPanBlockedTarget(e.target)) return;
    markUserInteracted();
    pan.active = true;
    pan.moved = false;
    pan.startX = e.clientX;
    pan.startScrollLeft = timeline.scrollLeft;
    timeline.classList.add("panning");
  });
  timeline.addEventListener("wheel", markUserInteracted, { passive: true });
  timeline.addEventListener("touchstart", markUserInteracted, { passive: true });
  window.addEventListener("mousemove", function (e) {
    if (!pan.active) return;
    var dx = e.clientX - pan.startX;
    if (Math.abs(dx) > 3) pan.moved = true;
    timeline.scrollLeft = pan.startScrollLeft - dx;
  });
  window.addEventListener("mouseup", function () {
    if (!pan.active) return;
    pan.active = false;
    timeline.classList.remove("panning");
    if (pan.moved) snapToNearestWeek(true);
  });

  var scrollTimer = null;
  timeline.addEventListener("scroll", function () {
    if (settling && !userInteracted && !correctingScroll) {
      correctingScroll = true;
      scrollToTodayColumn(false);
      correctingScroll = false;
    }
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(checkEdges, 120);
  });

  initWeeks();
  renderAll();
  requestAnimationFrame(function () {
    scrollToTodayColumn(false);
    initialScrollDone = true;
    // Re-assert the centered position a few more times over a short settle
    // window in case something outside this function's control (a browser
    // quirk, a future feature) nudges scrollLeft shortly after load. Any of
    // these becomes a no-op the moment the user actually interacts.
    [50, 150, 400, 900].forEach(function (delay) {
      setTimeout(function () {
        if (settling && !userInteracted) scrollToTodayColumn(false);
      }, delay);
    });
    setTimeout(function () { settling = false; }, 1500);
  });
})();
</script>
</body>
</html>
